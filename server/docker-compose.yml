services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gbm-backend-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./prisma/dev.db
      - JWT_SECRET=gbm_prod_secret_key_change_me_in_vault
      - RAZORPAY_WEBHOOK_SECRET=gbm_webhook_secret_key_change_me
    volumes:
      - gbm_db_data:/app/prisma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gbm_db_data:
    driver: local
